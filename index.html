<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertisseur de Devises </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html { font-family: 'Inter', sans-serif; }
        #result, #loading {
            display: none;
        }
    
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin {
            animation: spin 1s linear infinite;
        }
    </style>
</head>

<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">
    <div class="container bg-white p-6 sm:p-10 rounded-2xl shadow-xl w-full max-w-sm md:max-w-md border border-gray-100">

        <h1 class="text-3xl font-extrabold text-center text-indigo-700 mb-8 tracking-tight">
            Convertisseur de Devises
        </h1>

        <form id="converter-form" class="space-y-6">
            <div class="form-group">
                <label for="amount" class="block text-sm font-medium text-gray-700 mb-1">Montant</label>
                <input
                    type="number"
                    id="amount"
                    placeholder="Entrez le montant"
                    required
                    value="100"
                    min="0"
                    class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 shadow-sm text-lg"
                />
            </div>

            <div class="flex items-end space-x-2 sm:space-x-4">
                <div class="form-group flex-1">
                    <label for="from-currency" class="block text-sm font-medium text-gray-700 mb-1">De</label>
                    <select
                        id="from-currency"
                        class="w-full p-3 border border-gray-300 rounded-lg bg-white focus:ring-indigo-500 focus:border-indigo-500 shadow-sm appearance-none text-lg"
                    >
                        </select>
                </div>

                <button type="button" id="swap-button" title="Échanger les devises"
                    class="p-2 sm:p-3 bg-indigo-100 text-indigo-600 rounded-full shadow-md hover:bg-indigo-200 transition duration-200 transform hover:scale-110 mb-1"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                        <path d="M16 3h5v5"></path>
                        <path d="M16 3l-7 7"></path>
                        <path d="M8 21H3v-5"></path>
                        <path d="M8 21l7-7"></path>
                    </svg>
                </button>

                <div class="form-group flex-1">
                    <label for="to-currency" class="block text-sm font-medium text-gray-700 mb-1">À</label>
                    <select
                        id="to-currency"
                        class="w-full p-3 border border-gray-300 rounded-lg bg-white focus:ring-indigo-500 focus:border-indigo-500 shadow-sm appearance-none text-lg"
                    >
                        </select>
                </div>
            </div>

            <button
                type="submit"
                id="convert-button"
                class="w-full bg-indigo-600 text-white p-3 rounded-lg font-semibold text-lg shadow-md hover:bg-indigo-700 transition duration-200 ease-in-out transform hover:scale-[1.01]"
            >
                Convertir
            </button>
        </form>

        <div id="loading" class="mt-8 text-center text-indigo-600 font-semibold p-4 rounded-xl bg-indigo-50 border-2 border-indigo-200">
            <svg class="animate-spin h-6 w-6 mx-auto mb-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Chargement...
        </div>

        <div id="result" class="mt-8 text-center text-2xl font-bold p-4 rounded-xl bg-indigo-50 text-indigo-800 border-2 border-indigo-200">
            </div>
    </div>

    <script>
        const form = document.getElementById('converter-form');
        const swapButton = document.getElementById('swap-button');
        const amountInput = document.getElementById('amount');
        const fromCurrencySelect = document.getElementById('from-currency');
        const toCurrencySelect = document.getElementById('to-currency');
        const resultDiv = document.getElementById('result');
        const loadingDiv = document.getElementById('loading');
        const convertButton = document.getElementById('convert-button');

        // Taux de conversion  -  nov. 2025
        const exchangeRates = {
            'USD': 1.1587,  // Dollar US
            'JPY': 175.92,  // Yen Japonais
            'GBP': 0.8689,  // Livre Sterling
            'AUD': 1.7864,  // Dollar Australien
            'CAD': 1.6254,  // Dollar Canadien
            'CHF': 0.9228,  // Franc Suisse
            'CNY': 8.2576,  // Yuan Chinois
            'HKD': 9.0044,  // Dollar Hong Kong
            'INR': 102.4452, // Roupie Indienne
            'KRW': 1660.02, // Won Sud-Coréen
            'MXN': 21.3240, // Peso Mexicain
            'NZD': 2.0185,  // Dollar Néo-Zélandais
            'SGD': 1.5052,  // Dollar de Singapour
            'ZAR': 20.2312, // Rand Sud-Africain
            'BRL': 6.2411,  // Réal Brésilien
            'DKK': 7.4694,  // Couronne Danoise
            'SEK': 10.9160, // Couronne Suédoise
            'NOK': 11.6430, // Couronne Norvégienne
            'PLN': 4.2312,  // Zloty Polonais
            'TRY': 48.6754, // Lire Turque
            'EGP': 40.50,   // Livre Égyptienne (Estimation)
            'AED': 4.2568,  // Dirham EAU (Estimation)
            'SAR': 4.3478,  // Riyal Saoudien (Estimation)
            'THB': 38.107,  // Baht Thaïlandais
            'IDR': 19256.00, // Rupiah Indonésienne
            'MYR': 4.8813,  // Ringgit Malaisien
            'PHP': 67.477,  // Peso Philippin
            'RUB': 98.00,   // Rouble Russe (Estimation)
            'EUR': 1.00     // Euro (Base)
        };

        // Liste complète des devises, basée sur les taux réalistes
        const currencyList = {
            'EUR': 'Euro', 'USD': 'Dollar US', 'JPY': 'Yen Japonais', 'GBP': 'Livre Sterling',
            'AUD': 'Dollar Australien', 'CAD': 'Dollar Canadien', 'CHF': 'Franc Suisse',
            'CNY': 'Yuan Chinois (Renminbi)', 'HKD': 'Dollar Hong Kong', 'INR': 'Roupie Indienne',
            'KRW': 'Won Sud-Coréen', 'MXN': 'Peso Mexicain', 'NZD': 'Dollar Néo-Zélandais',
            'SGD': 'Dollar de Singapour', 'ZAR': 'Rand Sud-Africain', 'BRL': 'Réal Brésilien',
            'DKK': 'Couronne Danoise', 'SEK': 'Couronne Suédoise', 'NOK': 'Couronne Norvégienne',
            'PLN': 'Zloty Polonais', 'TRY': 'Lire Turque', 'EGP': 'Livre Égyptienne', 
            'AED': 'Dirham des Émirats', 'SAR': 'Riyal Saoudien', 'THB': 'Baht Thaïlandais', 
            'IDR': 'Rupiah Indonésienne', 'MYR': 'Ringgit Malaisien', 'PHP': 'Peso Philippin',
            'RUB': 'Rouble Russe'
        };

        function populateCurrencies() {
            const sortedCurrencies = Object.keys(currencyList).sort();

            for (const code of sortedCurrencies) {
                const name = currencyList[code];
                
                const optionFrom = document.createElement('option');
                optionFrom.value = code;
                optionFrom.textContent = `${code} (${name})`;
                fromCurrencySelect.appendChild(optionFrom);

                const optionTo = document.createElement('option');
                optionTo.value = code;
                optionTo.textContent = `${code} (${name})`;
                toCurrencySelect.appendChild(optionTo);
            }
            
            fromCurrencySelect.value = 'EUR';
            toCurrencySelect.value = 'USD';
        }
        swapButton.addEventListener('click', function() {
            const tempValue = fromCurrencySelect.value;
            fromCurrencySelect.value = toCurrencySelect.value;
            toCurrencySelect.value = tempValue;
            resultDiv.style.display = 'none';
        });

        async function convertCurrency(amount, from, to) {
            await new Promise(resolve => setTimeout(resolve, 800));

            const rateFrom = exchangeRates[from];
            const rateTo = exchangeRates[to];
            
            if (!rateFrom || !rateTo) {
                throw new Error("Devise non supportée dans les taux définis.");
            }

            const convertedAmount = amount * (rateTo / rateFrom);

            return convertedAmount;
        }
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const amount = parseFloat(amountInput.value);
            const fromCurrency = fromCurrencySelect.value;
            const toCurrency = toCurrencySelect.value;
            
            if (isNaN(amount) || amount <= 0) {
                resultDiv.textContent = "Veuillez entrer un montant valide (> 0).";
                resultDiv.className = 'mt-8 text-center text-xl font-bold p-4 rounded-xl bg-red-100 text-red-700 border-2 border-red-300';
                resultDiv.style.display = 'block';
                return;
            }
            resultDiv.style.display = 'none';
            loadingDiv.style.display = 'block';
            convertButton.disabled = true;
            convertButton.classList.add('opacity-50', 'cursor-not-allowed');

            try {
                const convertedAmount = await convertCurrency(amount, fromCurrency, toCurrency);
                resultDiv.textContent = `${amount.toFixed(2)} ${fromCurrency} = ${convertedAmount.toFixed(4)} ${toCurrency}`;
                resultDiv.className = 'mt-8 text-center text-2xl font-bold p-4 rounded-xl bg-indigo-50 text-indigo-800 border-2 border-indigo-200';

            } catch (error) {
                console.error("Erreur de conversion:", error);
                resultDiv.textContent = `Erreur: ${error.message}`;
                resultDiv.className = 'mt-8 text-center text-xl font-bold p-4 rounded-xl bg-red-100 text-red-700 border-2 border-red-300';
            } finally {
                loadingDiv.style.display = 'none';
                resultDiv.style.display = 'block';
                convertButton.disabled = false;
                convertButton.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });
        window.onload = populateCurrencies;
    </script>
</body>
</html>
